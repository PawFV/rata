#!/usr/sbin/nft -f
# RATA - nftables rules with comprehensive logging
# WARNING: These rules are for MONITORING, they don't block by default

flush ruleset

table inet rata_monitor {
    
    # Set for blocked IPs (can be added dynamically)
    set blocked_ips {
        type ipv4_addr
        flags timeout
    }
    
    # Set for suspicious IPs (alert but don't block)
    set suspicious_ips {
        type ipv4_addr
        flags timeout
    }
    
    # Known suspicious ports
    set suspicious_ports {
        type inet_service
        elements = { 4444, 5555, 1337, 31337, 6666, 6667 }
    }
    
    chain input {
        type filter hook input priority 0; policy accept;
        
        # Log all new inbound connections
        ct state new log prefix "[RATA_IN_NEW] " level info
        
        # Alert connections from suspicious IPs
        ip saddr @suspicious_ips log prefix "[RATA_SUSPICIOUS_IN] "
        
        # Block IPs in blocklist
        ip saddr @blocked_ips log prefix "[RATA_BLOCKED_IN] " drop
        
        # Log connections to suspicious ports
        tcp dport @suspicious_ports log prefix "[RATA_SUSP_PORT_IN] "
        udp dport @suspicious_ports log prefix "[RATA_SUSP_PORT_IN] "
    }
    
    chain output {
        type filter hook output priority 0; policy accept;
        
        # Log ALL new outbound connections (critical for detecting RAT)
        ct state new log prefix "[RATA_OUT_NEW] " level info
        
        # Alert connections to suspicious IPs
        ip daddr @suspicious_ips log prefix "[RATA_SUSPICIOUS_OUT] "
        
        # Block IPs in blocklist
        ip daddr @blocked_ips log prefix "[RATA_BLOCKED_OUT] " drop
        
        # Log connections to suspicious ports
        tcp dport @suspicious_ports log prefix "[RATA_SUSP_PORT_OUT] "
        udp dport @suspicious_ports log prefix "[RATA_SUSP_PORT_OUT] "
        
        # Log DNS (port 53) - useful for detecting DNS tunneling
        tcp dport 53 log prefix "[RATA_DNS_TCP] " level info
        udp dport 53 log prefix "[RATA_DNS_UDP] " level info
        
        # Log non-standard connections
        tcp dport != { 22, 53, 80, 443, 8080 } ct state new log prefix "[RATA_OUT_UNUSUAL] " level info
    }
    
    chain forward {
        type filter hook forward priority 0; policy accept;
        
        # Log all forward traffic (if acting as router)
        log prefix "[RATA_FORWARD] " level info
    }
}

# Table for connection counting (beaconing detection)
table inet rata_stats {
    chain count_connections {
        type filter hook output priority -100; policy accept;
        
        # Connection counter per destination
        ct state new counter
    }
}

